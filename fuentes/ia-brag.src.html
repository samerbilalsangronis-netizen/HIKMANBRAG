<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!--css:hikman2-->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0d0f; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; color: var(--hueso); }
      .full { position: absolute; inset: 0; }
      .golpe { position: absolute; left: 0; right: 0; top: 520px; text-align: center; opacity: 0; }
      .golpe .tick { font: 800 120px/1 "Barlow"; letter-spacing: .02em; }
      .golpe .big { font: 800 250px/1 "Mono"; letter-spacing: -0.04em; margin-top: 10px; }
      .golpe .lab { font: 700 34px/1.2 "Mono"; letter-spacing: .16em; color: var(--gris); text-transform: uppercase; margin-top: 26px; }
      .agenda { position: absolute; left: 110px; right: 110px; height: 120px; border-bottom: 2px solid var(--linea); display: flex; align-items: center; gap: 36px; opacity: 0; }
      .agenda .n { font: 700 34px/1 "Mono"; color: var(--gris); }
      .agenda .t { font: 800 74px/1 "Barlow"; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <!-- Resultados IA 29.10 · gancho (0-6,6) y apertura (6,6-13,3). Tiempos globales = locales. Datos: datos/hikman/ia-2026-10-29.json -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.3" data-width="1080" data-height="1920">
      <div id="fondo" class="clip full" data-start="0" data-duration="13.3" data-track-index="0">
        <div class="k-fondo"></div><div class="k-reticula"></div>
        <div id="barra"></div>
        <div id="balanza"></div>
      </div>

      <div id="s1" class="clip full" data-start="0" data-duration="13.3" data-track-index="1">
        <!-- Gancho: cifras gigantes, una por golpe de voz -->
        <div class="golpe" id="p1"><div class="tick">GOOGL</div><div class="big" style="color: var(--oso)">−10,4%</div><div class="lab">Alphabet · después del cierre</div></div>
        <div class="golpe" id="p2"><div class="tick">MSFT</div><div class="big" style="color: var(--toro)">≈ +4%</div><div class="lab">Microsoft · después del cierre</div></div>
        <div class="golpe" id="p3"><div class="lab" style="margin: 0 0 20px">Misma apuesta</div><div class="big" style="font-family: 'Barlow'; font-size: 300px; letter-spacing: 0">IA</div><div class="lab" id="p3b">Dos cajas distintas</div></div>
        <div class="full" id="barrido" style="background: var(--hueso); opacity: 0"></div>
        <div class="k-frase" id="a-f1" style="top: 470px; font-size: 104px">Buenos días, <em style="color: var(--toro)">inversor</em></div>
        <div id="a-tit" style="position: absolute; left: 0; right: 0; top: 700px; text-align: center; font: 600 30px/1 'Mono'; letter-spacing: .24em; color: var(--gris)">RESULTADOS TRAS EL CIERRE</div>
        <div class="agenda" id="a1" style="top: 780px"><span class="n">01</span><span class="t">Alphabet</span></div>
        <div class="agenda" id="a2" style="top: 900px"><span class="n">02</span><span class="t">Microsoft</span></div>
        <div class="agenda" id="a3" style="top: 1020px"><span class="n">03</span><span class="t">¿Por qué importa <span style="color: var(--oso)">para FX</span>?</span></div>
        <div class="k-frase" id="a-f2" style="font-size: 84px">Nueva fuente de <em style="color: var(--oso)">volatilidad</em></div>
        <div id="vela-c"></div>
      </div>
    </div>
    <!--js:helpers-->
    <!--js:hikman2-->
    <script>
      window.SEMANA = { publicacion: "Resultados · IA", etiqueta: "29.10.2026", temas: [],
        balanza: [[0, 0], [0.35, 0.6], [2.41, -0.3], [4.1, 0.1], [13.6, 0.3]] };
      const tl = gsap.timeline({ paused: true });
      K.barra(document.getElementById("barra"));
      K.balanza(document.getElementById("balanza"));
      K.moverBalanza(tl, "#balanza .k-marca", 0, 13.3);
      document.getElementById("vela-c").outerHTML = K.velaHTML("vc", "oso");
      const frase = (id, tIn, tOut) => {
        spring(tl, id, { opacity: 0, y: 50 }, { opacity: 1, y: 0 }, tIn, ESTANDAR);
        if (tOut != null) tl.to(id, { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, tOut);
      };

      // Golpes: cada cifra entra seca con su palabra ("Menos", "más", "Misma") y sale cortada por la siguiente
      const golpes = [["#p1", 0.35, 2.3], ["#p2", 2.41, 4.0], ["#p3", 4.11, 6.55]];
      golpes.forEach(([id, t0, t1]) => {
        spring(tl, id, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1 }, t0, { ease: "power4.out", duration: 0.25 });
        tl.to(id, { opacity: 0, scale: 0.92, duration: 0.08, ease: "power2.in" }, t1);
        // destello corto en cada corte
        tl.fromTo("#barrido", { opacity: 0 }, { opacity: 0.18, duration: 0.03, ease: "none", immediateRender: false }, t0 - 0.02);
        tl.to("#barrido", { opacity: 0, duration: 0.14, ease: "power2.out" }, t0 + 0.01);
      });
      tl.fromTo("#barrido", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo("#p3b", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 5.4);

      // Apertura: saludo, agenda y la frase de la voz
      frase("#a-f1", 6.8, null);
      spring(tl, "#a-tit", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, 8.8, SECO);
      for (let i = 1; i <= 3; i++) spring(tl, "#a" + i, { opacity: 0, x: -60 }, { opacity: 1, x: 0 }, 9.0 + i * 0.35, SECO);
      frase("#a-f2", 11.4, null);
      K.vela(tl, "vc", 13.3, null);
      tl.fromTo(["#a-f1", "#a-tit", "#a1", "#a2", "#a3", "#a-f2"], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
